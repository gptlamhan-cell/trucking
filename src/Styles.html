<style>
  :root {
    --ink: #1c2852;
    --muted: #505e7d;
    --brand: #253c81;
    --brand-dark: #192d68;
    --accent: #b82428;
    --line: #aab7d3;
    --soft: #edf1ff;
    --page: #f1f4fa;
    --ok: #08766d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 36px auto; padding: 0 16px; max-width: 780px;
    font: 16px Inter, system-ui, sans-serif; color: var(--ink); background: var(--page);
  }
  header {
    background: #fff; color: var(--brand); padding: 28px 32px;
    border-radius: 20px 20px 0 0; border-top: 4px solid #d52929; border-bottom: 1px solid #e2e7f3;
  }
  header .logo { display: block; height: auto; max-width: 100%; margin-bottom: 18px; object-fit: contain; }
  header h1 { margin: 6px 0; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.035em; }
  header p { margin: 0; color: var(--muted); }

  form { background: #fff; border-radius: 0 0 20px 20px; padding: 28px 32px; box-shadow: 0 8px 32px #16374716; }
  label { display: block; margin: 12px 0 0; font-weight: 650; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 24px; }
  label.check { font-weight: 500; display: flex; align-items: center; gap: 8px; }
  label.check input { width: auto; margin: 0; }
  input, select, button { font: inherit; padding: 8px; max-width: 100%; }
  input, select {
    display: block; width: 100%; margin: 6px 0 12px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
  }
  small { display: block; color: var(--muted); margin-bottom: 4px; }
  button { padding: 12px 22px; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  button.secondary { padding: 8px 14px; margin: -4px 0 8px; font-weight: 600; }
  #go { margin-top: 16px; background: var(--accent); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #788dcc; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .alert { background: #fdecec; color: #8a1c1f; border-radius: 8px; padding: 12px; margin-top: 0; }

  .combo { position: relative; }
  .combo input { margin-bottom: 4px; }
  #sug {
    position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin: 0; padding: 4px 0; list-style: none;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px #16374726;
    max-height: 320px; overflow-y: auto;
  }
  #sug li { padding: 8px 12px; cursor: pointer; line-height: 1.3; }
  #sug li[aria-selected="true"], #sug li:hover { background: var(--soft); }
  #sug li b { display: block; font-weight: 650; }
  #sug li span { font-size: 14px; color: var(--muted); }
  #sug li.foot { cursor: default; font-size: 12px; color: var(--muted); text-align: right; background: none; }

  #o:not(:empty) { margin-top: 16px; background: var(--soft); border-left: 4px solid var(--brand); border-radius: 12px; padding: 16px; }
  #o .err { color: #8a1c1f; font-weight: 650; }
  #o .route { margin: 0 0 8px; color: var(--muted); }
  #o table { width: 100%; border-collapse: collapse; font-size: 15px; }
  #o th, #o td { padding: 6px 4px; text-align: right; border-bottom: 1px solid #d5ddf0; }
  #o th:first-child, #o td:first-child { text-align: left; white-space: normal; }
  #o th, #o td { white-space: nowrap; }
  #o td small { margin: 0; font-size: 12px; }
  #o tfoot td { border: 0; }
  #o .total td { font-size: clamp(18px, 5vw, 22px); font-weight: 800; color: var(--brand); padding-top: 10px; }
  #o .note { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  #o .actions { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  #o .actions button { padding: 8px 14px; }

  @media (max-width: 560px) {
    body { margin: 16px auto; }
    header, form { padding: 20px; }
    .row { grid-template-columns: 1fr; }
    #o table { font-size: 14px; }
  }
</style>
